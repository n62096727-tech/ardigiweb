<!DOCTYPE html>
<html>
<head>
    <title>My Personal Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 45px;
            margin: 10px;
        }

        nav {
            background: #444;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        section {
            background: white;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            color: #0077cc;
        }

        .skills span {
            display: inline-block;
            background: #0077cc;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Your Name</h1>
        <p>Student | Developer | Designer</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about">
        <h2>About Me</h2>
        <p>
            Hello! I am Your Name. I am interested in technology,
            programming and web development.
        </p>
    </section>

    <section id="skills">
        <h2>My Skills</h2>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Python</span>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>

        <p>Email: yourname@email.com</p>
        <p>Phone: +91 12345 67890</p>
    </section>

    <footer>
        <p>© 2026 Your Name</p>
    </footer>

</body>
</html>
